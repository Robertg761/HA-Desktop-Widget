name: Website deploy check

# Compares every page, asset and response header on the live site with main's website/, without
# publishing anything. The Website deploy workflow publishes the site (a stable release runs it from
# the release commit) and makes the same comparison itself. A failure here means the live site is
# not main's website/: main has website changes since the last deploy, or a deploy failed.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-deploy-check
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # The site must match main, whichever branch the run was started from.
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Compare the deployed site with website/
        run: node scripts/check-website-deploy.cjs --wait 300

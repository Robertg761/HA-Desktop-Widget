name: Issue 184 native monitor validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-monitors:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build:renderer
      - run: node -e "require('electron')"
      - name: Compile macOS virtual display helper
        if: runner.os == 'macOS'
        run: clang -fobjc-arc -framework Cocoa -framework CoreGraphics scripts/monitor-validation/mac-displays.m -o scripts/monitor-validation/mac-displays
      - name: Install Windows virtual outputs
        if: runner.os == 'Windows'
        shell: powershell
        run: ./scripts/monitor-validation/windows-setup.ps1
      - name: Native monitor tests
        run: node scripts/monitor-validation/run.cjs
      - name: Monitor regression tests
        if: always()
        run: npx jest --runInBand tests/unit/window-display.test.js tests/unit/window-display-main.test.js tests/unit/window-display-settings.test.js tests/unit/window-display-config.test.js tests/unit/main-window-startup.test.js tests/unit/main-display-changes.test.js tests/unit/tray-menu-main.test.js tests/integration/settings-config.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: monitor-validation-${{ runner.os }}
          path: monitor-validation-results/

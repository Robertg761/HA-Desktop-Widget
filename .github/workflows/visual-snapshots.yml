name: Visual snapshots

# Screenshots of the real app on Windows, macOS and Linux, uploaded as artifacts,
# so layout and theming can be checked per OS without installing a build.
# Each OS produces <os>-<scene>-page.png (web contents) and <os>-<scene>-screen.png
# (the real screen around the window: acrylic, vibrancy, shadows, native fonts).
# See scripts/visual-snapshots/run.cjs. Informational only: nothing is compared.
#
# Each OS runs the scenes in two jobs, one per half of the list (SNAPSHOT_SHARD, see
# scripts/visual-snapshots/shard.cjs). With every scene in one job, a slow windows-latest runner
# ran past the 45-minute limit. Each half uploads visual-snapshots-<OS>-shard-<k>, and the merge
# job joins the two into the one artifact per OS that reviewers download: visual-snapshots-Windows,
# visual-snapshots-Windows-11-arm, visual-snapshots-macOS and visual-snapshots-Linux.
#
# windows-latest is Windows Server 2022. windows-11-arm is the only hosted Windows 11 image (free
# for public repositories; ARM64 rather than x64), and its captures, in
# visual-snapshots-Windows-11-arm, show the Windows 11 shell: taskbar, fonts. The widget's own
# corners are not what they show: the window is a transparent frameless one, and whether Windows
# rounds or shades it needs a real machine (docs/testing/PLATFORM-TEST-PLAN-4.0.md, WIN11-3).
# Neither draws acrylic: hosted runners have no GPU, so both show the solid fallback even with
# transparency effects on. Checking acrylic still needs a real Windows 11 machine.

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'styles.css'
      - 'dashboard-workflows.css'
      - 'renderer.js'
      - 'main.js'
      - 'preload.js'
      - 'src/**'
      - 'packages/widget-renderer/**'
      - 'fonts/**'
      - 'locales/**'
      - 'locale-packs/**'
      - 'scripts/visual-snapshots/**'
      - '.github/workflows/visual-snapshots.yml'

permissions:
  contents: read

concurrency:
  group: visual-snapshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshots:
    name: snapshots (${{ matrix.os }}, shard ${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, windows-11-arm, macos-latest, ubuntu-latest]
        shard: [1, 2]
        # The OS in the artifact names. Both Windows images report runner.os Windows, so the
        # Windows 11 one gets its own.
        include:
          - os: windows-latest
            artifact: Windows
          - os: windows-11-arm
            artifact: Windows-11-arm
          - os: macos-latest
            artifact: macOS
          - os: ubuntu-latest
            artifact: Linux
    runs-on: ${{ matrix.os }}
    # On a healthy runner, setup takes 1 to 7 minutes and a half of the scenes 7 to 9.
    timeout-minutes: 30
    env:
      # The number after the slash is the length of the shard list above.
      SNAPSHOT_SHARD: ${{ matrix.shard }}/2
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # The snapshot runner drives the app over CDP with Node's global WebSocket (Node 22+).
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      # The app bundles Latin, Cyrillic, Greek and Vietnamese fonts only, and the image has no
      # Devanagari font, so every Hindi string in the hi-* scenes was drawn as boxes. fonts-noto-core
      # has Noto Sans Devanagari, the font most Linux desktops fall back to for Hindi. It also has
      # Noto Sans Arabic, as Ubuntu desktops do, so from the first run with it the Linux ar-* captures
      # may draw Arabic in a different font. That change is the runner's, not the app's.
      - name: Install native build dependencies and fonts (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libxt-dev libxinerama-dev libxrandr-dev libxext-dev libx11-xcb-dev libxkbcommon-dev libxkbcommon-x11-dev libxkbfile-dev libpng-dev xvfb imagemagick fonts-noto-core

      - name: Install dependencies
        run: npm ci

      - name: Build renderer
        run: npm run build:renderer

      # Electron downloads its binary on first use rather than at install time; fetch it now so
      # the Linux sandbox helper below exists and the snapshot timeouts don't include a download.
      - name: Download Electron
        run: node -e "require('electron')"

      - name: Take snapshots (Linux)
        timeout-minutes: 20
        if: runner.os == 'Linux'
        run: |
          # The npm-installed Electron's sandbox helper lacks the setuid bit.
          sandbox=node_modules/electron/dist/chrome-sandbox
          if [ -f "$sandbox" ]; then
            sudo chown root:root "$sandbox"
            sudo chmod 4755 "$sandbox"
          fi
          xvfb-run -a -s "-screen 0 1280x900x24" dbus-run-session -- \
            node scripts/visual-snapshots/run.cjs visual-snapshots

      # Windows 11 draws acrylic only while transparency effects are on, which a fresh VM may have
      # off. Turn them on and tell running apps the setting changed.
      - name: Turn on transparency effects (Windows 11)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $key = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize'
          if (-not (Test-Path $key)) { New-Item -Path $key -Force | Out-Null }
          Set-ItemProperty -Path $key -Name EnableTransparency -Value 1 -Type DWord
          Add-Type -Namespace Win32 -Name Native -MemberDefinition '[DllImport("user32.dll", CharSet = CharSet.Auto)] public static extern System.IntPtr SendMessageTimeout(System.IntPtr hWnd, uint Msg, System.UIntPtr wParam, string lParam, uint fuFlags, uint uTimeout, out System.UIntPtr lpdwResult);'
          $result = [System.UIntPtr]::Zero
          # HWND_BROADCAST, WM_SETTINGCHANGE, SMTO_ABORTIFHUNG
          [Win32.Native]::SendMessageTimeout([System.IntPtr]0xffff, 0x1A, [System.UIntPtr]::Zero, 'ImmersiveColorSet', 2, 5000, [ref]$result) | Out-Null
          Get-ItemProperty -Path $key | Select-Object EnableTransparency

      # The Windows 11 image opens the first-run "Choose privacy settings for your device" window
      # (hosted by WWAHost) at sign-in, and closing it leaves the Start menu open; both sit over
      # the widget in the screen captures. Close them (the Start menu host restarts hidden), and
      # log what else has a window in case a later image changes what opens.
      - name: Close first-run windows (Windows 11)
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          Get-Process | Where-Object { $_.MainWindowHandle -ne 0 } |
            Format-Table ProcessName, Id, MainWindowTitle -AutoSize | Out-String -Width 200
          Get-Process | Where-Object {
            $_.ProcessName -in @('WWAHost', 'CloudExperienceHostBroker') -or $_.MainWindowTitle -match 'privacy'
          } | ForEach-Object {
            Write-Output "Closing $($_.ProcessName) ($($_.Id)): $($_.MainWindowTitle)"
            Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 2
          Get-Process -Name StartMenuExperienceHost, SearchHost -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Output "Closing $($_.ProcessName) ($($_.Id))"
              Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue
            }
          Start-Sleep -Seconds 2

      # The runner's agent keeps a console window (hosted-compute-agent) on the desktop. It covered
      # the lower third of every Windows 11 pin capture and sat behind the widget in the others. The
      # pointer rests in the middle of the screen, where the widget opens, so the first capture also
      # showed the native tooltip of the tile under it. Minimize what is open and park the pointer in
      # the top-left corner, clear of the widget and its pins. The run never moves the real pointer:
      # scenes click through the page, not the mouse.
      - name: Clear the desktop (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-Type -Namespace Win32 -Name Desktop -MemberDefinition '[DllImport("user32.dll")] public static extern bool ShowWindow(System.IntPtr hWnd, int nCmdShow); [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y);'
          # explorer's own window is the desktop and the taskbar, which stay.
          Get-Process | Where-Object { $_.MainWindowHandle -ne 0 -and $_.ProcessName -ne 'explorer' } |
            ForEach-Object {
              Write-Output "Minimizing $($_.ProcessName) ($($_.Id)): $($_.MainWindowTitle)"
              # SW_MINIMIZE
              [Win32.Desktop]::ShowWindow($_.MainWindowHandle, 6) | Out-Null
            }
          [Win32.Desktop]::SetCursorPos(0, 0) | Out-Null

      - name: Take snapshots (Windows, macOS)
        timeout-minutes: 20
        if: runner.os != 'Linux'
        run: node scripts/visual-snapshots/run.cjs visual-snapshots

      # Only the merge job reads this one. It is kept for a day so that re-running one failed half
      # can merge again with the other half from the first attempt. A re-run keeps the run's
      # artifacts, so a half run again finds its first attempt's captures under this name (this
      # step runs after a failure too). The new captures replace them: without overwrite, the
      # upload failed on the name it found.
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: visual-snapshots-${{ matrix.artifact }}-shard-${{ matrix.shard }}
          path: visual-snapshots/
          if-no-files-found: warn
          retention-days: 1
          overwrite: true

  # One artifact per OS, as before the suite was split. The scene files of the two halves have
  # different names, so they merge into one folder without overwriting each other. It runs after a
  # half has failed too, so that half's captures, the -failed ones included, still arrive. That
  # takes always() and not !cancelled(): a job that runs out of time ends as cancelled.
  #
  # Re-running a failed half re-runs this job as well, and the first attempt's
  # visual-snapshots-<OS> is still on the run. upload-artifact/merge has no overwrite, so it failed
  # on that name. The halves are downloaded into one folder and uploaded with overwrite instead.
  merge:
    needs: snapshots
    if: always()
    strategy:
      fail-fast: false
      matrix:
        artifact: [Windows, Windows-11-arm, macOS, Linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download the halves
        uses: actions/download-artifact@v7
        with:
          pattern: visual-snapshots-${{ matrix.artifact }}-shard-*
          path: visual-snapshots
          merge-multiple: true

      # An OS whose halves both stopped before uploading anything has nothing to merge, and the
      # job says so, as upload-artifact/merge did.
      - name: Merge the halves
        uses: actions/upload-artifact@v6
        with:
          name: visual-snapshots-${{ matrix.artifact }}
          path: visual-snapshots/
          if-no-files-found: error
          retention-days: 14
          overwrite: true

name: Tag Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Stable version to release (X.Y.Z, no leading v)
        required: true
        type: string
  push:
    branches:
      # Alternative trigger for environments that can push branches but cannot
      # dispatch workflows: push a branch named release-tag/X.Y.Z pointing at
      # the main HEAD to release. The branch is deleted after tagging.
      - 'release-tag/*'

permissions:
  actions: write
  contents: write

concurrency:
  group: tag-release
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main with tags
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Tag main and start the release workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == 'workflow_dispatch' ]]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${REF_NAME#release-tag/}"
          fi

          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION. Expected X.Y.Z (stable, no leading v)." >&2
            exit 1
          fi

          release_tag="v$VERSION"

          if git rev-parse --verify "refs/tags/$release_tag" >/dev/null 2>&1; then
            echo "Release tag already exists: $release_tag" >&2
            exit 1
          fi

          # The release workflow requires the tagged commit's package metadata to
          # match the tag, so insist the version bump has already landed on main.
          pkg_version="$(node -p "require('./package.json').version")"
          if [[ "$pkg_version" != "$VERSION" ]]; then
            echo "package.json on main is $pkg_version but the requested release is $VERSION." >&2
            echo "Land the version bump on main before tagging the release." >&2
            exit 1
          fi

          main_sha="$(git rev-parse HEAD)"
          successful_ci_run="$(
            gh run list \
              --workflow ci.yml \
              --commit "$main_sha" \
              --status success \
              --limit 1 \
              --json databaseId,headSha \
              --jq '.[0].databaseId // empty'
          )"
          if [[ -z "$successful_ci_run" ]]; then
            echo "No successful CI run exists for main commit $main_sha." >&2
            echo "Wait for CI to pass, then run the tag workflow again." >&2
            exit 1
          fi

          git fetch origin main --depth=1
          latest_main_sha="$(git rev-parse origin/main)"
          if [[ "$latest_main_sha" != "$main_sha" ]]; then
            echo "origin/main advanced from $main_sha to $latest_main_sha during validation." >&2
            echo "Run the tag workflow again after CI passes for the new main commit." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$release_tag" -m "$release_tag"
          # The release workflow accepts this exact tested commit while it remains
          # contained in main, so a normal main advance after validation cannot
          # strand an otherwise valid release tag.
          git push origin "refs/tags/$release_tag:refs/tags/$release_tag"

          # Tags pushed with GITHUB_TOKEN do not trigger on-push workflows, so
          # dispatch the release workflow explicitly (same as the nightly beta).
          gh workflow run release.yml \
            --ref "$release_tag" \
            --raw-field "release_tag=$release_tag"
          echo "Tagged main as $release_tag and dispatched the release workflow."

          if [[ "$EVENT_NAME" == 'push' ]]; then
            git push origin --delete "$REF_NAME" || true
          fi

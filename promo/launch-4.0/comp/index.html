<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>HADW 4.0 spot</title>
<style>
  @font-face { font-family: 'Jakarta'; font-weight: 200 800; src: url('assets/plus-jakarta-sans-latin.woff2') format('woff2'); }
  @font-face { font-family: 'Inter'; font-weight: 100 900; src: url('assets/inter-latin.woff2') format('woff2'); }
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #stage {
    position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #05070b;
    font-family: 'Inter', 'Noto Sans', sans-serif; color: #fff;
    -webkit-font-smoothing: antialiased; text-rendering: geometricPrecision;
  }
  #bg { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .scene { position: absolute; inset: 0; display: none; overflow: hidden; }
  .scene.on { display: block; }
  .world { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-style: preserve-3d; transform-origin: 0 0; }
  .persp { position: absolute; inset: 0; perspective: 2200px; perspective-origin: 50% 50%; transform-style: preserve-3d; }

  /* An app window: real footage over a blurred backdrop. Sized in app px (500x660). */
  .win { position: absolute; left: 0; top: 0; width: 500px; height: 660px; transform-origin: 0 0; transform-style: flat; }
  .win .shadow { position: absolute; inset: 0; border-radius: 13px; box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 10px 26px rgba(0,0,0,.35); }
  .win .glass { position: absolute; inset: 0; border-radius: 13px; overflow: hidden;
    backdrop-filter: blur(26px) saturate(1.5) brightness(.95); -webkit-backdrop-filter: blur(26px) saturate(1.5); }
  .win .shot { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 13px; }
  .win .rim { position: absolute; inset: 0; border-radius: 13px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.13), inset 0 1px 0 rgba(255,255,255,.18); pointer-events: none; }
  .win .glare { position: absolute; inset: 0; border-radius: 13px; overflow: hidden; pointer-events: none; mix-blend-mode: screen; }
  .win .glare i { position: absolute; top: -40%; left: -60%; width: 40%; height: 180%; transform: rotate(18deg);
    background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.13) 45%, rgba(255,255,255,.22) 50%, rgba(255,255,255,.13) 55%, rgba(255,255,255,0)); }
  .win.light .rim { box-shadow: inset 0 0 0 1px rgba(255,255,255,.5), inset 0 1px 0 rgba(255,255,255,.7); }
  .cursor { position: absolute; left: 0; top: 0; width: 22px; height: 32px; transform-origin: 2px 2px; pointer-events: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,.45)); }
  .ripple { position: absolute; width: 40px; height: 40px; margin: -20px 0 0 -20px; border-radius: 50%; border: 2px solid rgba(255,255,255,.8); opacity: 0; }

  /* Type */
  .type { position: absolute; white-space: nowrap; }
  .h1 { font-family: 'Jakarta'; font-weight: 800; letter-spacing: -0.035em; line-height: 1.02; }
  .h2 { font-family: 'Jakarta'; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; color: rgba(225,232,245,.82); }
  .cap { font-family: 'Inter'; font-weight: 500; letter-spacing: .02em; color: rgba(210,220,235,.7); }
  .w { display: inline-block; overflow: hidden; vertical-align: top; padding: 0.06em 0.02em 0.12em; margin: -0.06em -0.02em -0.12em; }
  .w > span { display: inline-block; will-change: transform; }
  .grad { background: linear-gradient(100deg, #ffffff 0%, #cfe6ff 40%, #64b5f6 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .pill { position: absolute; padding: 12px 22px 12px 18px; border-radius: 999px; background: rgba(18,22,30,.72);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.14), 0 12px 40px rgba(0,0,0,.4); backdrop-filter: blur(20px);
    font: 600 26px/1 'Jakarta'; letter-spacing: -0.01em; color: #fff; display: flex; align-items: center; gap: 12px; white-space: nowrap; }
  .pill b { width: 10px; height: 10px; border-radius: 50%; background: #64b5f6; box-shadow: 0 0 12px #64b5f6; }

  /* Black and flash sit above the scenes (each scene has its own z-index); the vignette stays on the background. */
  .flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; mix-blend-mode: screen; z-index: 101; }
  .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(0,0,0,.55) 100%); }
  .black { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; z-index: 100; }
  .glow { position: absolute; border-radius: 50%; pointer-events: none; mix-blend-mode: screen; }

  /* Keycaps */
  .key { position: absolute; width: 230px; height: 230px; border-radius: 34px; transform-style: preserve-3d;
    font: 700 64px/1 'Jakarta'; color: #e9eef7; display: flex; align-items: center; justify-content: center; }
  .key .cap-top { position: absolute; inset: 0; border-radius: 34px;
    background: linear-gradient(160deg, #3a404c 0%, #22262e 55%, #191c22 100%);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.18), inset 0 -10px 18px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.06); display:flex; align-items:center; justify-content:center; }
  .key .cap-side { position: absolute; inset: 0; border-radius: 34px; background: #0d0f13; transform: translateZ(-38px); box-shadow: 0 40px 80px rgba(0,0,0,.6); }
  .key.wide { width: 330px; }

  /* Devices */
  .device { position: absolute; transform-style: preserve-3d; }
  .screen { position: absolute; overflow: hidden; background: #000; }
  .bezel { position: absolute; border-radius: 22px; background: linear-gradient(180deg, #1d2128, #0c0e12); box-shadow: 0 0 0 2px #2a2f38, 0 40px 90px rgba(0,0,0,.6); }
  .base { position: absolute; background: linear-gradient(180deg, #c9ced6, #8e949e); }

  /* Desktop chrome */
  .topbar { position: absolute; left: 0; right: 0; top: 0; height: 34px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px;
    font: 600 15px/1 'Inter'; color: rgba(255,255,255,.88); background: rgba(10,12,18,.35); backdrop-filter: blur(20px); box-sizing: border-box; }

  /* Omarchy-ish */
  .wbar { position: absolute; left: 10px; right: 10px; top: 8px; height: 36px; border-radius: 0; display: flex; align-items: center; justify-content: space-between;
    font: 600 15px/1 'JetBrains Mono', 'DejaVu Sans Mono', monospace; color: #cdd6e4; padding: 0 14px; box-sizing: border-box; }
  .tile-o { position: absolute; border: 2px solid #3b4252; background: rgba(16,18,24,.92); border-radius: 0; overflow: hidden; }
  .term { font: 15px/1.5 'DejaVu Sans Mono', monospace; color: #9aa7bd; padding: 14px 16px; white-space: pre; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" width="640" height="360"></canvas>
  <div id="scenes"></div>
  <div class="vignette" id="vig"></div>
  <div class="black" id="black"></div>
  <div class="flash" id="flash"></div>
</div>
<script src="lib.js"></script>
<script src="scenes.js"></script>
</body>
</html>

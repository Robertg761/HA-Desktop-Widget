# electron-builder configuration (moved out of package.json's "build" key so the
# dbus-next exclusion list below can be defined once and shared via a YAML anchor).
productName: HA Desktop Widget
# Keep in sync with the top-level "appId" in package.json: src/windows-startup.cjs and
# src/linux-startup.cjs read it at runtime to name the Windows Run-key value and the
# Linux autostart .desktop file, and a mismatch orphans existing users' autostart entries.
appId: com.github.robertg761.hadesktopwidget
directories:
  buildResources: build
  output: dist
afterPack: scripts/after-pack-mac-adhoc-sign.cjs
files:
  - index.html
  # Self-hosted Inter / Plus Jakarta Sans woff2 subsets referenced by the
  # @font-face block at the top of styles.css. Without these the packaged app
  # falls back to system sans, because the CSP no longer allows fonts.gstatic.com.
  - fonts/**/*
  - locales/**/*
  - main.js
  - profile-sync-core.js
  - src/**/*
  - packages/widget-renderer/**/*
  - dist-preload/**/*
  - dist-renderer/**/*
  - styles.css
  - dashboard-workflows.css
  - build/icon.ico
  - build/icon.png
  - build/icons/512x512.png
  - build/trayTemplate.png
  - build/trayTemplate@2x.png
  - package.json
  - '!node_modules/usocket/**/*'
asar: true
compression: normal
publish:
  - provider: github
    owner: Robertg761
    repo: HA-Desktop-Widget
    releaseType: release

mac:
  minimumSystemVersion: '12.0'
  # The system no longer masks a third-party icon, so this is the artwork already in build/icon.png,
  # set on Apple's icon grid by scripts/derive-icons.py (which also writes the other sizes).
  icon: build/icon-mac.png
  category: public.app-category.utilities
  extendInfo:
    # The widget lives in the menu bar and has no Dock icon. app.dock.hide() does the same at
    # runtime, after the Dock has already drawn (and bounced) the icon at every launch.
    LSUIElement: true
  x64ArchFiles: '**/uiohook-napi/prebuilds/darwin-*/uiohook-napi.node'
  # A platform `files` list REPLACES the top-level one for the app's own files (builder-debug.yml
  # shows `**/*` plus only this list's exclusions when it holds nothing else), so a list of
  # exclusions alone packs the whole repository: tests, docs, the website, vendored sources. This
  # one therefore repeats the top-level allowlist (tests/unit/electron-builder-config.test.js keeps
  # the two in step) and adds the exclusions below. The top-level list still applies to
  # node_modules, which is why its `!node_modules/usocket` entry is not repeated here.
  #
  # dbus-next and its exclusive transitive dependency subtree (per package-lock.json:
  # event-stream and its stream helpers, xml2js/xmlbuilder, long, jsbi, hexy,
  # @nornagon/put). It is only required lazily by src/portal-global-shortcuts.cjs on
  # Linux Wayland, so mac/win packages strip it (win reuses this list via the YAML
  # alias below). Do NOT hoist the exclusions into the top-level `files` list: they
  # would strip dbus-next from Linux builds too and break portal global shortcuts at
  # runtime. When upgrading dbus-next, re-derive this list from package-lock.json. The alias
  # makes mac.files and win.files one shared array instance; do not reuse the anchor under
  # top-level files/extraFiles/extraResources — app-builder-lib normalizes those in place,
  # which would corrupt the shared list for the platform sections.
  files: &platformFiles
    - index.html
    - fonts/**/*
    - locales/**/*
    - main.js
    - profile-sync-core.js
    - src/**/*
    - packages/widget-renderer/**/*
    - dist-preload/**/*
    - dist-renderer/**/*
    - styles.css
    - dashboard-workflows.css
    - build/icon.ico
    - build/icon.png
    - build/icons/512x512.png
    - build/trayTemplate.png
    - build/trayTemplate@2x.png
    - package.json
    - '!node_modules/dbus-next/**/*'
    - '!node_modules/event-stream/**/*'
    - '!node_modules/hexy/**/*'
    - '!node_modules/jsbi/**/*'
    - '!node_modules/long/**/*'
    - '!node_modules/@nornagon/put/**/*'
    - '!node_modules/xml2js/**/*'
    - '!node_modules/xmlbuilder/**/*'
    - '!node_modules/through/**/*'
    - '!node_modules/duplexer/**/*'
    - '!node_modules/from/**/*'
    - '!node_modules/map-stream/**/*'
    - '!node_modules/pause-stream/**/*'
    - '!node_modules/split/**/*'
    - '!node_modules/stream-combiner/**/*'
win:
  icon: build/icon.ico
  files: *platformFiles
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: '${productName}-${version}-win-${arch}-Setup.${ext}'
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Home Assistant Widget
portable:
  artifactName: '${productName}-${version}-win-${arch}-Portable.${ext}'
linux:
  # A directory of standard sizes (16x16.png ... 512x512.png), installed under
  # usr/share/icons/hicolor/<size>/apps/. A single 847 px file landed in an 847x847 directory that
  # no icon theme lists, so launchers and docks fell back to the generic icon.
  icon: build/icons
  category: Utility
  synopsis: Home Assistant controls on your desktop
  maintainer: Robertg761 <robertgordon761@gmail.com>
  # Layer-shell helper for tiling Wayland compositors (issue #79). Built from
  # vendor/windowtolayer (GPL-3.0-or-later, spawned as a separate process; the
  # COPYING file ships next to the binary). `npm run dist:linux` builds it.
  extraResources:
    - from: vendor/windowtolayer/target/release/windowtolayer
      to: helpers/windowtolayer
    - from: vendor/windowtolayer/COPYING
      to: helpers/windowtolayer-COPYING
    # Omarchy 4 bar plugin, copied into ~/.config/omarchy/plugins by the tray's
    # "Add to Omarchy Bar" item (src/omarchy-bar.cjs).
    - from: omarchy-plugin
      to: omarchy-plugin
  # Match Electron's runtime app id, the installed launcher, and the app's
  # existing XDG autostart file so desktop environments associate its windows.
  syncDesktopName: true
  artifactName: '${productName}-${version}-linux-${arch}.${ext}'
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
deb:
  # Setting recommends replaces electron-builder's default (libappindicator3-1, for the tray
  # icon), so that one is listed again. gnome-keyring is a Secret Service, which the widget
  # needs to remember the Home Assistant sign-in and the sync passphrase.
  recommends:
    - libappindicator3-1
    - gnome-keyring

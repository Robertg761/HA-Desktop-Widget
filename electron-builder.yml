# electron-builder configuration, formerly the "build" key of package.json.
productName: HA Desktop Widget
# Keep in sync with the top-level "appId" in package.json: src/windows-startup.cjs and
# src/linux-startup.cjs read it at runtime to name the Windows Run-key value and the
# Linux autostart .desktop file, and a mismatch orphans existing users' autostart entries.
appId: com.github.robertg761.hadesktopwidget
directories:
  buildResources: build
  output: dist
afterPack: scripts/after-pack-mac-adhoc-sign.cjs
# The app's own files are this allowlist. linux, mac and win each have a `files` list as well, for
# what only that platform drops, and electron-builder does not add one to the other: once it has
# loaded this file, the top-level list is a file set of its own and the platform list another, and a
# set made only of exclusions packs everything but them, the whole repository with its tests, docs,
# website and vendored sources. So every platform list also names package.json, which ships anyway,
# and this allowlist still bounds the rest. tests/unit/electron-builder-config.test.js loads the
# configuration the way electron-builder does and fails if a platform packs a file it does not name.
files:
  - index.html
  # Self-hosted Inter / Plus Jakarta Sans woff2 subsets referenced by the
  # @font-face block at the top of styles.css. Without these the packaged app
  # falls back to system sans, because the CSP no longer allows fonts.gstatic.com.
  - fonts/**/*
  - locales/**/*
  - main.js
  - profile-sync-core.js
  - src/**/*
  - packages/widget-renderer/**/*
  - dist-preload/**/*
  - dist-renderer/**/*
  - styles.css
  - dashboard-workflows.css
  - build/icon.ico
  - build/icon.png
  - build/icons/512x512.png
  - build/trayTemplate.png
  - build/trayTemplate@2x.png
  - package.json
  # usocket is dbus-next's optional native add-on for passing file descriptors. The app never uses
  # it: every dbus-next connection in src/ (portal-global-shortcuts, portal-color-scheme,
  # kwin-window-raise, linux-tray-host) gets its address from getNetSessionBusAddress(), which
  # makes dbus-next open an ordinary net socket instead. Excluding the package alone
  # left everything it pulls in, about 6 MB in the asar: node-gyp, tar, undici, nan, nopt and their
  # helpers. Those are the packages package-lock.json reaches only through usocket, and nothing
  # that ships requires them; tests/unit/electron-builder-config.test.js recomputes the list from
  # the lock file and fails if it drifts, e.g. when an upgrade of electron-updater starts needing
  # one. electron-builder hoists the production tree before it filters, so a package that
  # package-lock.json nests under node-gyp or tar (undici, which, isexe, env-paths, yallist) is
  # matched at node_modules/<name>, and each is listed by that name. semver is the one exception:
  # node-gyp's copy is hoisted to the top while electron-updater keeps its own beside it, so a
  # pattern for the name could one day remove the copy electron-updater needs. Its 58 files stay.
  - '!node_modules/usocket/**/*'
  - '!node_modules/node-gyp/**/*'
  - '!node_modules/nan/**/*'
  - '!node_modules/bindings/**/*'
  - '!node_modules/file-uri-to-path/**/*'
  - '!node_modules/tar/**/*'
  - '!node_modules/@isaacs/fs-minipass/**/*'
  - '!node_modules/chownr/**/*'
  - '!node_modules/minipass/**/*'
  - '!node_modules/minizlib/**/*'
  - '!node_modules/exponential-backoff/**/*'
  - '!node_modules/fdir/**/*'
  - '!node_modules/picomatch/**/*'
  - '!node_modules/tinyglobby/**/*'
  - '!node_modules/nopt/**/*'
  - '!node_modules/abbrev/**/*'
  - '!node_modules/proc-log/**/*'
  - '!node_modules/undici/**/*'
  - '!node_modules/which/**/*'
  - '!node_modules/isexe/**/*'
  - '!node_modules/env-paths/**/*'
  - '!node_modules/yallist/**/*'
  # The Material Design Icons font. index.html links @mdi/font's own stylesheet, whose @font-face
  # offers the font as .eot, .woff2, .woff and .ttf, in that order. Chromium skips the .eot, a
  # format only Internet Explorer reads, and loads the first one it can, the .woff2, so the other
  # three (3.2 MB) are never opened. The scss sources and the css source maps are for building a
  # stylesheet of one's own. tests/unit/electron-builder-config.test.js checks that the stylesheet
  # still offers the woff2 first and that nothing that ships points at a file dropped here.
  - '!node_modules/@mdi/font/fonts/*.eot'
  - '!node_modules/@mdi/font/fonts/*.ttf'
  - '!node_modules/@mdi/font/fonts/*.woff'
  - '!node_modules/@mdi/font/scss/**/*'
  - '!node_modules/@mdi/font/css/*.map'
  # uiohook-napi, the keyboard hook behind the popup hotkey on Windows and macOS. Its loader,
  # node-gyp-build, takes build/Release/uiohook_napi.node when electron-builder's rebuild step
  # compiled one on the build machine, and prebuilds/<platform>-<arch>/uiohook-napi.node when it
  # did not. The C sources and binding.gyp are only for that compile, which runs in node_modules
  # before anything is packed. The prebuilds for other systems are dropped per platform below.
  - '!node_modules/uiohook-napi/binding.gyp'
  - '!node_modules/uiohook-napi/libuiohook/**/*'
  - '!node_modules/uiohook-napi/src/**/*'
asar: true
compression: normal
# Chromium draws its own interface (the right-click menu in a text field, the spelling menu, the
# dialogs it opens) from one locale .pak file per language, and Electron ships all 55 of them,
# about 46 MB per install. These are the ones that match the app's seven languages (APP_LANGUAGES in
# src/i18n-main.cjs: en, de, es, fr, ar, hi, zh), including the regional paks Chromium sends those
# languages to. Checked against Electron 43 on Linux by setting LANG and reading app.getLocale():
#   es-419  every Latin American Spanish system (es-MX, es-AR, es-US, ...); es-ES gets es
#   zh-TW   zh-HK, zh-MO and Traditional Chinese; zh-CN covers zh-SG and Simplified Chinese
#   en-GB   en-AU, en-CA, en-IN, en-NZ and en-ZA; en-US is every other English, and the fallback
#           for a system language with no pak, which Chromium cannot start without
# de-AT, de-CH, fr-CA, fr-BE, ar-EG and hi-IN need nothing extra: they resolve to de, fr, ar and
# hi. A system language the app has no pak for (pt-BR, ja) gets Chromium's English menus, the same
# language its own text is in. Which language the app itself shows does not depend on these files;
# detectSystemLocale in src/i18n-main.cjs reads the operating system. electron-builder keeps a pak
# whose name is an entry or the part of one before its dash, so "es-419" would keep es.pak by
# itself; both are listed so the intent reads plainly. Windows and Linux use this list. macOS has
# its own under `mac`, because it names the same choice with underscores.
electronLanguages:
  - en-US
  - en-GB
  - de
  - es
  - es-419
  - fr
  - ar
  - hi
  - zh-CN
  - zh-TW
publish:
  - provider: github
    owner: Robertg761
    repo: HA-Desktop-Widget
    releaseType: release

mac:
  minimumSystemVersion: '12.0'
  # The system no longer masks a third-party icon, so this is the artwork already in build/icon.png,
  # set on Apple's icon grid by scripts/derive-icons.py (which also writes the other sizes).
  icon: build/icon-mac.png
  category: public.app-category.utilities
  extendInfo:
    # The widget lives in the menu bar and has no Dock icon. app.dock.hide() does the same at
    # runtime, after the Dock has already drawn (and bounced) the icon at every launch.
    LSUIElement: true
  x64ArchFiles: '**/uiohook-napi/prebuilds/darwin-*/uiohook-napi.node'
  # The same languages as the top-level electronLanguages, as macOS names them: the Electron
  # framework keeps a locale.pak in a folder per language ("es_419.lproj", "en_GB.lproj"), and
  # electron-builder matches an entry against that folder name, so the dashes above would not match.
  # Each language also has _FEMININE, _MASCULINE and _NEUTER folders, holding paks of 18 bytes in
  # every language kept here. They cost nothing, and Chromium may look for them next to its
  # language's folder, so they stay.
  electronLanguages:
    - en
    - en_FEMININE
    - en_MASCULINE
    - en_NEUTER
    - en_GB
    - en_GB_FEMININE
    - en_GB_MASCULINE
    - en_GB_NEUTER
    - de
    - de_FEMININE
    - de_MASCULINE
    - de_NEUTER
    - es
    - es_FEMININE
    - es_MASCULINE
    - es_NEUTER
    - es_419
    - es_419_FEMININE
    - es_419_MASCULINE
    - es_419_NEUTER
    - fr
    - fr_FEMININE
    - fr_MASCULINE
    - fr_NEUTER
    - ar
    - ar_FEMININE
    - ar_MASCULINE
    - ar_NEUTER
    - hi
    - hi_FEMININE
    - hi_MASCULINE
    - hi_NEUTER
    - zh_CN
    - zh_CN_FEMININE
    - zh_CN_MASCULINE
    - zh_CN_NEUTER
    - zh_TW
    - zh_TW_FEMININE
    - zh_TW_MASCULINE
    - zh_TW_NEUTER
  # dbus-next and its exclusive transitive dependency subtree (per package-lock.json:
  # event-stream and its stream helpers, xml2js/xmlbuilder, long, jsbi, hexy,
  # @nornagon/put). It is only required lazily by src/portal-global-shortcuts.cjs on
  # Linux Wayland, so mac/win packages strip it. win.files repeats the list, because YAML
  # cannot join two lists and the two differ in their uiohook-napi lines;
  # tests/unit/electron-builder-config.test.js keeps the copies equal. Do NOT hoist these
  # into the top-level `files` list: top-level and per-platform lists are additive, so that
  # would strip dbus-next from Linux builds too and break portal global shortcuts at
  # runtime. When upgrading dbus-next, re-derive this list from package-lock.json.
  #
  # Then the uiohook-napi prebuilds of the other systems. Every package keeps the x64 and arm64
  # builds of its own system and no other, which also drops linux-loong64. The macOS app is
  # universal and needs both darwin builds; x64ArchFiles above has the merge take them as they are.
  # package.json is here so that the list is not exclusions alone (see the top-level `files`).
  files:
    - package.json
    - '!node_modules/dbus-next/**/*'
    - '!node_modules/event-stream/**/*'
    - '!node_modules/hexy/**/*'
    - '!node_modules/jsbi/**/*'
    - '!node_modules/long/**/*'
    - '!node_modules/@nornagon/put/**/*'
    - '!node_modules/xml2js/**/*'
    - '!node_modules/xmlbuilder/**/*'
    - '!node_modules/through/**/*'
    - '!node_modules/duplexer/**/*'
    - '!node_modules/from/**/*'
    - '!node_modules/map-stream/**/*'
    - '!node_modules/pause-stream/**/*'
    - '!node_modules/split/**/*'
    - '!node_modules/stream-combiner/**/*'
    - '!node_modules/uiohook-napi/prebuilds/linux-*/**/*'
    - '!node_modules/uiohook-napi/prebuilds/win32-*/**/*'
win:
  icon: build/icon.ico
  # package.json and the dbus-next list of mac.files, then the uiohook-napi prebuilds of the other
  # systems. The release is x64 only (target below), and Windows on Arm runs it under emulation
  # with the win32-x64 build; win32-arm64 is for an arm64 package.
  files:
    - package.json
    - '!node_modules/dbus-next/**/*'
    - '!node_modules/event-stream/**/*'
    - '!node_modules/hexy/**/*'
    - '!node_modules/jsbi/**/*'
    - '!node_modules/long/**/*'
    - '!node_modules/@nornagon/put/**/*'
    - '!node_modules/xml2js/**/*'
    - '!node_modules/xmlbuilder/**/*'
    - '!node_modules/through/**/*'
    - '!node_modules/duplexer/**/*'
    - '!node_modules/from/**/*'
    - '!node_modules/map-stream/**/*'
    - '!node_modules/pause-stream/**/*'
    - '!node_modules/split/**/*'
    - '!node_modules/stream-combiner/**/*'
    - '!node_modules/uiohook-napi/prebuilds/darwin-*/**/*'
    - '!node_modules/uiohook-napi/prebuilds/linux-*/**/*'
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  artifactName: '${productName}-${version}-win-${arch}-Setup.${ext}'
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: always
  createStartMenuShortcut: true
  # No shortcutName: the Desktop and Start menu shortcuts are always named for productName, "HA
  # Desktop Widget", and an install that made them under another name has them renamed on upgrade.
portable:
  artifactName: '${productName}-${version}-win-${arch}-Portable.${ext}'
linux:
  # A directory of standard sizes (16x16.png ... 512x512.png), installed under
  # usr/share/icons/hicolor/<size>/apps/. A single 847 px file landed in an 847x847 directory that
  # no icon theme lists, so launchers and docks fell back to the generic icon.
  icon: build/icons
  category: Utility
  synopsis: Home Assistant controls on your desktop
  maintainer: Robertg761 <robertgordon761@gmail.com>
  # Layer-shell helper for tiling Wayland compositors (issue #79). Built from
  # vendor/windowtolayer (GPL-3.0-or-later, spawned as a separate process; the
  # COPYING file ships next to the binary). `npm run dist:linux` builds it.
  extraResources:
    - from: vendor/windowtolayer/target/release/windowtolayer
      to: helpers/windowtolayer
    - from: vendor/windowtolayer/COPYING
      to: helpers/windowtolayer-COPYING
    # Omarchy 4 bar plugin, copied into ~/.config/omarchy/plugins by the tray's
    # "Add to Omarchy Bar" item (src/omarchy-bar.cjs).
    - from: omarchy-plugin
      to: omarchy-plugin
  # package.json (see the top-level `files`), then the uiohook-napi prebuilds of the other systems
  # and linux-loong64. main.js does not load uiohook on Linux, where the popup hotkey goes through
  # globalShortcut or the desktop portal (src/linux-popup-hotkey.cjs,
  # src/portal-global-shortcuts.cjs), so the two Linux builds that stay, 70 KB each, only keep the
  # package whole should that change.
  files:
    - package.json
    - '!node_modules/uiohook-napi/prebuilds/darwin-*/**/*'
    - '!node_modules/uiohook-napi/prebuilds/win32-*/**/*'
    - '!node_modules/uiohook-napi/prebuilds/linux-loong64/**/*'
  # Match Electron's runtime app id, the installed launcher, and the app's
  # existing XDG autostart file so desktop environments associate its windows.
  syncDesktopName: true
  artifactName: '${productName}-${version}-linux-${arch}.${ext}'
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
deb:
  # Setting recommends replaces electron-builder's default (libappindicator3-1, for the tray
  # icon), so that one is listed again. gnome-keyring is a Secret Service, which the widget
  # needs to remember the Home Assistant sign-in and the sync passphrase.
  recommends:
    - libappindicator3-1
    - gnome-keyring
